<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Heebo";
        font-weight: 700;
        font-style: normal;
        src: url("public/fonts/heebo-700.woff2") format("woff2");
      }
      @font-face {
        font-family: "Heebo";
        font-weight: 800;
        font-style: normal;
        src: url("public/fonts/heebo-800.woff2") format("woff2");
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b1026;
      }
      body { font-family: "Heebo", sans-serif; }

      #bg {
        width: 1920px; height: 1080px;
        background:
          radial-gradient(1200px 800px at 50% 38%, #2a3d75 0%, #182450 45%, #0b1026 100%);
      }
      .glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55; }

      /* ---- character (positioned with explicit left/top; GSAP owns transform) ---- */
      #char { position: absolute; left: 700px; top: 150px; width: 520px; height: 620px; }
      #head {
        position: absolute; left: 60px; top: 40px; width: 400px; height: 430px;
        background: linear-gradient(180deg, #ffd9b8 0%, #f6c199 100%);
        border-radius: 46% 46% 44% 44% / 50% 50% 46% 46%;
        box-shadow: 0 30px 80px rgba(0,0,0,0.45);
      }
      #hair {
        position: absolute; left: 44px; top: 18px; width: 432px; height: 220px;
        background: linear-gradient(180deg, #3a2b23 0%, #24170f 100%);
        border-radius: 50% 50% 40% 40% / 70% 70% 40% 40%;
      }
      .ear { position: absolute; top: 230px; width: 60px; height: 90px; background: #f2b98c; border-radius: 50%; }
      #ear-l { left: 40px; } #ear-r { right: 40px; }
      .eyebrow { position: absolute; top: 208px; width: 96px; height: 18px; background: #3a2b23; border-radius: 12px; }
      #brow-l { left: 150px; } #brow-r { right: 150px; }
      .eye {
        position: absolute; top: 240px; width: 74px; height: 74px; background: #fff;
        border-radius: 50%; box-shadow: inset 0 4px 8px rgba(0,0,0,0.12); overflow: hidden;
      }
      #eye-l { left: 148px; } #eye-r { right: 148px; }
      .pupil { position: absolute; left: 50%; top: 54%; transform: translate(-50%,-50%); width: 34px; height: 34px; background: #2a1d16; border-radius: 50%; }
      .pupil::after { content: ""; position: absolute; left: 8px; top: 7px; width: 11px; height: 11px; background: #fff; border-radius: 50%; }
      #nose { position: absolute; left: 237px; top: 320px; width: 46px; height: 70px; background: #eeae82; border-radius: 40% 40% 50% 50%; }
      #mouth {
        position: absolute; left: 185px; top: 400px; width: 150px; height: 26px;
        background: #7a2b2b; border-radius: 0 0 90px 90px / 0 0 70px 70px;
        transform-origin: 50% 0%;
      }
      #mouth::after { content: ""; position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); width: 96px; height: 8px; background: #d98c8c; border-radius: 50%; }
      #neck { position: absolute; left: 195px; top: 430px; width: 130px; height: 90px; background: #f2b98c; border-radius: 0 0 30px 30px; }
      #body {
        position: absolute; left: 30px; top: 500px; width: 460px; height: 180px;
        background: linear-gradient(180deg, #4f74e0 0%, #3550b0 100%);
        border-radius: 120px 120px 40px 40px; box-shadow: 0 -6px 0 rgba(255,255,255,0.08) inset;
      }

      /* ---- captions (full-width container, no transform; inner pill is RTL) ---- */
      .caption { position: absolute; left: 0; right: 0; bottom: 130px; text-align: center; }
      .cap-inner {
        display: inline-block; direction: rtl;
        font-family: "Heebo", sans-serif; font-size: 84px; font-weight: 800; color: #ffffff;
        text-shadow: 0 6px 24px rgba(0,0,0,0.55);
        padding: 18px 48px; background: rgba(10,16,42,0.45); border-radius: 26px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5.6"
      data-width="1920"
      data-height="1080"
    >
      <!-- background -->
      <div id="bg" class="clip" data-start="0" data-duration="5.6" data-track-index="0">
        <div class="glow" style="left:260px; top:180px; width:420px; height:420px; background:#6c8bff;"></div>
        <div class="glow" style="right:220px; bottom:120px; width:480px; height:480px; background:#ff8bd0;"></div>
      </div>

      <!-- character -->
      <div id="char" class="clip" data-start="0" data-duration="5.6" data-track-index="1">
        <div id="body"></div>
        <div id="neck"></div>
        <div id="hair"></div>
        <div id="head"></div>
        <div id="ear-l" class="ear"></div>
        <div id="ear-r" class="ear"></div>
        <div id="brow-l" class="eyebrow"></div>
        <div id="brow-r" class="eyebrow"></div>
        <div id="eye-l" class="eye"><div class="pupil"></div></div>
        <div id="eye-r" class="eye"><div class="pupil"></div></div>
        <div id="nose"></div>
        <div id="mouth"></div>
      </div>

      <!-- captions -->
      <div id="cap1" class="caption clip" data-start="0.12" data-duration="1.47" data-track-index="2"><span class="cap-inner">שלום לכולם!</span></div>
      <div id="cap2" class="caption clip" data-start="1.608" data-duration="1.76" data-track-index="2"><span class="cap-inner">נעים מאוד להכיר</span></div>
      <div id="cap3" class="caption clip" data-start="3.384" data-duration="2.216" data-track-index="2"><span class="cap-inner">וברוכים הבאים לסרטון</span></div>

      <!-- audio: Hebrew voiceover (Meta MMS-TTS, neural) -->
      <audio
        id="vo"
        src="public/voice.mp3"
        data-start="0"
        data-duration="5.6"
        data-track-index="10"
        data-volume="1"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // character enter
      tl.from("#char", { y: 40, opacity: 0, scale: 0.94, duration: 0.5, ease: "power3.out" }, 0);

      // gentle head bob while speaking (single writer, explicit endpoints)
      tl.fromTo("#char", { y: 0 }, { y: -10, duration: 0.6, ease: "sine.inOut", repeat: 7, yoyo: true }, 0.6);

      // mouth "talking" — flaps only during each spoken phrase, rests in the gaps.
      // Windows match the per-phrase audio marks (deterministic, seek-safe).
      function talk(start, repeats) {
        tl.to("#mouth", { scaleY: 2.0, duration: 0.13, ease: "sine.inOut", repeat: repeats, yoyo: true }, start);
      }
      talk(0.12, 9);    // "שלום לכולם!"        (~1.33s)
      talk(1.608, 11);  // "נעים מאוד להכיר"    (~1.62s)
      talk(3.384, 13);  // "וברוכים הבאים לסרטון" (~1.90s)

      // blinks
      tl.to("#eye-l, #eye-r", { scaleY: 0.1, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, 1.35);
      tl.to("#eye-l, #eye-r", { scaleY: 0.1, duration: 0.08, yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, 3.9);

      // eyebrow lift on greeting
      tl.to("#brow-l, #brow-r", { y: -10, duration: 0.3, yoyo: true, repeat: 1, ease: "power2.out" }, 0.3);

      // caption pops (synced to phrase starts)
      tl.from("#cap1", { y: 30, opacity: 0, duration: 0.32, ease: "back.out(2)" }, 0.12);
      tl.from("#cap2", { y: 30, opacity: 0, duration: 0.32, ease: "back.out(2)" }, 1.608);
      tl.from("#cap3", { y: 30, opacity: 0, duration: 0.32, ease: "back.out(2)" }, 3.384);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
