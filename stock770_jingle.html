<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סטוק 770 – שיר פרסומת</title>
<style>
  :root{
    --gold:#e9c46a; --gold2:#f4d58d; --dark:#1a120b; --dark2:#2a1c10; --red:#9b1c2e;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:"Heebo","Arial Hebrew",Arial,sans-serif;
    background:radial-gradient(circle at 50% 20%, #3a2614 0%, var(--dark) 70%);
    color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .card{
    width:min(92vw,640px); background:linear-gradient(160deg,var(--dark2),#150d06);
    border:2px solid var(--gold); border-radius:24px; padding:34px 28px 40px;
    box-shadow:0 0 60px rgba(233,196,106,.25), inset 0 0 40px rgba(0,0,0,.6);
    text-align:center; position:relative;
  }
  .brand{font-size:clamp(40px,9vw,72px); font-weight:900; letter-spacing:1px;
    background:linear-gradient(180deg,var(--gold2),var(--gold)); -webkit-background-clip:text;
    background-clip:text; color:transparent; text-shadow:0 4px 14px rgba(0,0,0,.4);}
  .sub{color:var(--gold); font-size:clamp(16px,4vw,22px); margin-top:2px; letter-spacing:4px;}
  .lyrics{margin:26px auto 8px; min-height:140px; display:flex; flex-direction:column;
    gap:10px; justify-content:center;}
  .line{font-size:clamp(20px,5vw,30px); font-weight:700; opacity:.28;
    transition:all .35s ease; transform:translateY(6px); line-height:1.5;}
  .line.active{opacity:1; transform:translateY(0) scale(1.04); color:var(--gold2);
    text-shadow:0 0 18px rgba(244,213,141,.6);}
  .play{margin-top:18px; background:linear-gradient(180deg,var(--gold2),var(--gold));
    color:#3a2200; border:none; padding:15px 42px; font-size:22px; font-weight:900;
    border-radius:50px; cursor:pointer; font-family:inherit;
    box-shadow:0 8px 22px rgba(233,196,106,.35); transition:transform .15s;}
  .play:active{transform:scale(.95);}
  .bar{height:6px; background:rgba(255,255,255,.1); border-radius:6px; margin-top:22px; overflow:hidden;}
  .fill{height:100%; width:0%; background:linear-gradient(90deg,var(--red),var(--gold));
    transition:width .1s linear;}
  .tag{margin-top:14px; color:#bbb; font-size:14px;}
  .glasses{position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    font-size:30px; filter:drop-shadow(0 0 8px var(--gold));}
</style>
</head>
<body>
  <div class="card">
    <div class="glasses">🥃🍷🍸</div>
    <div class="brand">סְטוֹק 770</div>
    <div class="sub">מַשְׁקָאוֹת חֲרִיפִים</div>

    <div class="lyrics" id="lyrics"></div>

    <button class="play" id="play">▶ נַגֵּן אֶת הַשִּׁיר</button>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="tag">שיר פרסומת · 20 שניות</div>
  </div>

<script>
/* ============================================================
   "סטוק 770" – שיר פרסומת בן 20 שניות
   - מנגינה: Web Audio API (סינתיסייזר פנימי, ללא קבצים חיצוניים)
   - מילים: הקראה עברית מדויקת עם ניקוד מלא (SpeechSynthesis he-IL)
   ============================================================ */

// ----- מילות השיר (עם ניקוד מלא להגייה מדויקת) -----
const LINES = [
  { t: 0.4,  txt: "סְטוֹק שֶׁבַע שֶׁבַע אֶפֶס,",           say: "סְטוֹק שֶׁבַע שֶׁבַע אֶפֶס" },
  { t: 5.0,  txt: "מַשְׁקָאוֹת בַּמְּחִיר הֲכִי טוֹב!",      say: "מַשְׁקָאוֹת בַּמְּחִיר הֲכִי טוֹב" },
  { t: 9.6,  txt: "וִיסְקִי, וֶדְקָה וְיַיִן מְשֻׁבָּח,",    say: "וִיסְקִי, וֶדְקָה וְיַיִן מְשֻׁבָּח" },
  { t: 14.2, txt: "בּוֹאוּ לַחֲגֹג, הַטַּעַם שֶׁמְּשַׂמֵּחַ!", say: "בּוֹאוּ לַחֲגֹג, הַטַּעַם שֶׁמְּשַׂמֵּחַ" },
  { t: 18.4, txt: "סְטוֹק 770 — לְחַיִּים! 🥃",            say: "סְטוֹק שֶׁבַע שֶׁבַע אֶפֶס, לְחַיִּים" },
];

const DURATION = 20; // שניות

// ----- בניית שורות המילים על המסך -----
const lyricsEl = document.getElementById('lyrics');
const lineEls = LINES.map(l => {
  const d = document.createElement('div');
  d.className = 'line'; d.textContent = l.txt;
  lyricsEl.appendChild(d); return d;
});

// ----- מנגינה: ג'ינגל קצבי ושמח -----
let audioCtx;
function playMelody(){
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const now = audioCtx.currentTime;

  // תווים (Hz) – מוטיב פרסומת עליז במז'ור
  const C=261.63, D=293.66, E=329.63, F=349.23, G=392.0, A=440.0, B=493.88, C2=523.25, G2=783.99;

  // מלודיה ראשית – פעימה לכל ~0.4ש' לאורך 20ש'
  const melody = [
    [G,0.0,0.35],[C2,0.4,0.35],[G,0.8,0.35],[E,1.2,0.5],
    [F,1.8,0.35],[A,2.2,0.35],[G,2.6,0.6],
    [E,3.4,0.35],[G,3.8,0.35],[C2,4.2,0.6],
    [G,5.0,0.35],[C2,5.4,0.35],[B,5.8,0.35],[A,6.2,0.5],
    [G,6.8,0.35],[A,7.2,0.35],[G,7.6,0.6],
    [E,8.4,0.35],[F,8.8,0.35],[G,9.2,0.6],
    [C2,9.6,0.4],[B,10.0,0.4],[A,10.4,0.4],[G,10.8,0.5],
    [A,11.4,0.4],[B,11.8,0.4],[C2,12.2,0.6],
    [G,13.0,0.4],[E,13.4,0.4],[C,13.8,0.5],
    [E,14.2,0.4],[G,14.6,0.4],[C2,15.0,0.5],
    [C2,15.6,0.4],[B,16.0,0.4],[A,16.4,0.4],[G,16.8,0.5],
    [E,17.4,0.4],[F,17.8,0.4],[G,18.2,0.4],
    [C2,18.6,0.5],[E,19.1,0.5],[C2,19.6,0.4],
  ];
  melody.forEach(([f,t,d]) => tone(f, now+t, d, 'triangle', 0.18));

  // ליין באס – יסוד קצבי
  const bass = [C,E,F,G,C,F,G,C, C,E,F,G, C,F,G,C, C,E,F,G];
  for(let i=0;i<bass.length;i++){
    tone(bass[i]/2, now + i*1.0, 0.85, 'sine', 0.22);
  }
  // נקישת קצב (hi-hat קליל)
  for(let t=0;t<DURATION;t+=0.5){ noise(now+t, 0.05, 0.05); }
}

function tone(freq, start, dur, type, vol){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  o.connect(g); g.connect(audioCtx.destination);
  g.gain.setValueAtTime(0, start);
  g.gain.linearRampToValueAtTime(vol, start+0.02);
  g.gain.exponentialRampToValueAtTime(0.001, start+dur);
  o.start(start); o.stop(start+dur+0.05);
}
function noise(start, dur, vol){
  const b = audioCtx.createBuffer(1, audioCtx.sampleRate*dur, audioCtx.sampleRate);
  const data = b.getChannelData(0);
  for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1);
  const s = audioCtx.createBufferSource(); s.buffer=b;
  const g = audioCtx.createGain(); const hp = audioCtx.createBiquadFilter();
  hp.type='highpass'; hp.frequency.value=6000;
  s.connect(hp); hp.connect(g); g.connect(audioCtx.destination);
  g.gain.setValueAtTime(vol,start); g.gain.exponentialRampToValueAtTime(0.001,start+dur);
  s.start(start); s.stop(start+dur);
}

// ----- הקראת המילים בעברית (הגייה מדויקת) -----
function speakLines(){
  const voices = speechSynthesis.getVoices();
  const heVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('he'));
  LINES.forEach(l => {
    setTimeout(() => {
      const u = new SpeechSynthesisUtterance(l.say);
      u.lang = 'he-IL'; if(heVoice) u.voice = heVoice;
      u.rate = 1.0; u.pitch = 1.15; u.volume = 1.0;
      speechSynthesis.cancel(); // לוודא שאין חפיפה
      speechSynthesis.speak(u);
    }, l.t * 1000);
  });
}

// ----- סנכרון הדגשת השורות + פס התקדמות -----
function runVisuals(){
  const start = performance.now();
  const fill = document.getElementById('fill');
  function frame(){
    const el = (performance.now() - start) / 1000;
    fill.style.width = Math.min(100, (el/DURATION)*100) + '%';
    let cur = -1;
    for(let i=0;i<LINES.length;i++){ if(el >= LINES[i].t) cur = i; }
    lineEls.forEach((e,i)=> e.classList.toggle('active', i===cur));
    if(el < DURATION+0.5) requestAnimationFrame(frame);
    else lineEls.forEach(e=>e.classList.remove('active'));
  }
  requestAnimationFrame(frame);
}

// ----- כפתור הפעלה -----
const btn = document.getElementById('play');
btn.addEventListener('click', () => {
  if(speechSynthesis.getVoices().length === 0){
    speechSynthesis.onvoiceschanged = () => {};
    speechSynthesis.getVoices();
  }
  playMelody();
  speakLines();
  runVisuals();
  btn.textContent = '♪ מתנגן...';
  setTimeout(()=>{ btn.textContent='▶ נַגֵּן שׁוּב'; }, DURATION*1000);
});
</script>
</body>
</html>
